name: Build CK Auto APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Create the correct Android folder structure
      - name: Create Android Folder Structure
        run: |
          mkdir -p app/src/main/java/com/ckauto/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

      # 2. Move your existing files to their correct homes
      - name: Move Existing Files
        run: |
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/ckauto/app/ || true
          [ -f UssdEngine.kt ] && mv UssdEngine.kt app/src/main/java/com/ckauto/app/ || true
          [ -f UssdService.kt ] && mv UssdService.kt app/src/main/java/com/ckauto/app/ || true
          [ -f SmsReceiver.kt ] && mv SmsReceiver.kt app/src/main/java/com/ckauto/app/ || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/ || true
          [ -f ic_launcher.xml ] && mv ic_launcher.xml app/src/main/res/drawable/ || true
          [ -f accessibility_config.xml ] && mv accessibility_config.xml app/src/main/res/xml/ || true
          [ -f build.gradle.kts ] && mv build.gradle.kts app/ || true
          [ -f settings.gradle.kts ] && mv settings.gradle.kts ./ || true

      # 3. Create MISSING files so the build doesn't crash
      - name: Create Missing Files
        run: |
          cat > app/src/main/java/com/ckauto/app/KeepAliveService.kt << 'EOF'
          package com.ckauto.app
          import android.app.Service
          import android.content.Intent
          import android.os.IBinder
          class KeepAliveService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          if [ ! -f app/src/main/java/com/ckauto/app/MainActivity.kt ]; then
            cat > app/src/main/java/com/ckauto/app/MainActivity.kt << 'EOF'
          package com.ckauto.app
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
              companion object {
                  fun deliver() {}
              }
          }
          EOF
          fi

          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="CK Auto is Running" />
          </LinearLayout>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.AppCompat.DayNight.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar" />
          </resources>
          EOF

          if [ ! -f app/build.gradle.kts ]; then
            cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.ckauto.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ckauto.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF
          fi

      # 4. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 5. Ensure the root settings.gradle.kts exists
      - name: Ensure settings.gradle.kts exists
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo 'rootProject.name = "CKAuto"' > settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi

      # 6. Set up Gradle and generate the wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      # 7. Build the APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 8. Upload the APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: app/build/outputs/apk/debug/app-debug.apk
