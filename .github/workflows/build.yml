name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List files in repository
        run: ls -R
        
      - name: Find and Unzip
        run: |
          # Find the zip file anywhere in the repo and unzip it to a folder called 'android'
          ZIP_FILE=$(find . -name "ck-auto-android.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Could not find ck-auto-android.zip anywhere in the repository!"
            exit 1
          fi
          echo "Found zip file at: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d android
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android
        
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CK-Auto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
